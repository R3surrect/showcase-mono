name: CD

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ENV
    steps:
      - name: cd
        uses: appleboy/ssh-action@v1.0.3
        env:
          ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS }}
          NODE_ENV: ${{ vars.NODE_ENV }}
          PORT: ${{ vars.PORT }}
          VITE_BACKEND_API_URL: ${{ vars.VITE_BACKEND_API_URL }}
          VITE_FRONTEND_PORT: ${{ vars.VITE_FRONTEND_PORT }}
          PGDATABASE: ${{ secrets.PGDATABASE }}
          PGPASSWORD: ${{ secrets.PGPASSWORD }}
          PGUSER: ${{ secrets.PGUSER }}
          PGHOST: ${{ secrets.PGHOST }}
          PGPORT: ${{ secrets.PGPORT }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: ALLOWED_ORIGINS,NODE_ENV,PORT,VITE_BACKEND_API_URL,VITE_FRONTEND_PORT,PGDATABASE,PGPASSWORD,PGUSER,PGHOST,PGPORT,JWT_SECRET
          script: |
            set -e
            cd /home/deploy/showcase-mono
            git fetch origin
            git checkout main
            git pull origin main

            # packages/frontend/.env.production
            printf '%s\n' \
              "VITE_BACKEND_API_URL=$VITE_BACKEND_API_URL" \
              "VITE_FRONTEND_PORT=$VITE_FRONTEND_PORT" \
              > ./packages/frontend/.env.production

            # packages/backend/.env.production
            printf '%s\n' \
              "PORT=$PORT" \
              "JWT_SECRET='$JWT_SECRET'" \
              "NODE_ENV=$NODE_ENV" \
              "ALLOWED_ORIGINS=$ALLOWED_ORIGINS" \
              > ./packages/backend/.env.production

            # packages/database/.env.production
            printf '%s\n' \
              "PGDATABASE=$PGDATABASE" \
              "PGPASSWORD='$PGPASSWORD'" \
              "PGUSER=$PGUSER" \
              "PGHOST=$PGHOST" \
              "PGPORT=$PGPORT" \
              > ./packages/database/.env.production

            docker compose up --build -d
