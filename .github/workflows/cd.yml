name: CD

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ENV
    steps:
      - name: cd
        uses: appleboy/ssh-action@v1.0.3
        env:
          ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS }}
          NODE_ENV: ${{ vars.NODE_ENV }}
          PORT: ${{ vars.PORT }}
          VITE_BACKEND_API_PORT: ${{ vars.VITE_BACKEND_API_PORT }}
          VITE_BACKEND_API_URL: ${{ vars.VITE_BACKEND_API_URL }}
          VITE_FRONTEND_PORT: ${{ vars.VITE_FRONTEND_PORT }}
          PGDATABASE: ${{ secrets.PGDATABASE }}
          PGPASSWORD: ${{ secrets.PGPASSWORD }}
          PGUSER: ${{ secrets.PGUSER }}
          PGHOST: ${{ secrets.PGHOST }}
          PGPORT: ${{ secrets.PGPORT }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: ALLOWED_ORIGINS,NODE_ENV,PORT,VITE_BACKEND_API_PORT,VITE_BACKEND_API_URL,VITE_FRONTEND_PORT,PGDATABASE,PGPASSWORD,PGUSER,PGHOST,PGPORT,JWT_SECRET
          script: |
            set -e
            cd /home/deploy/showcase-mono
            git fetch origin
            git checkout chore/cd
            git pull origin chore/cd

            # packages/frontend/.env.production
            echo "VITE_BACKEND_API_PORT='$VITE_BACKEND_API_PORT'" > ./packages/frontend/.env.production
            echo "VITE_BACKEND_API_URL='$VITE_BACKEND_API_URL'" >> ./packages/frontend/.env.production
            echo "VITE_FRONTEND_PORT='$VITE_FRONTEND_PORT'" >> ./packages/frontend/.env.production
            
            # packages/backend/.env.production
            echo "PORT='$PORT'" > ./packages/backend/.env.production
            echo "JWT_SECRET='$JWT_SECRET'" >> ./packages/backend/.env.production
            echo "NODE_ENV='$NODE_ENV'" >> ./packages/backend/.env.production
            echo "ALLOWED_ORIGINS='$ALLOWED_ORIGINS'" >> ./packages/backend/.env.production
            
            # packages/database/.env.production
            echo "PGDATABASE='$PGDATABASE'" > ./packages/database/.env.production
            echo "PGPASSWORD='$PGPASSWORD'" >> ./packages/database/.env.production
            echo "PGUSER='$PGUSER'" >> ./packages/database/.env.production
            echo "PGHOST='$PGHOST'" >> ./packages/database/.env.production
            echo "PGPORT='$PGPORT'" >> ./packages/database/.env.production

            docker compose up --build -d