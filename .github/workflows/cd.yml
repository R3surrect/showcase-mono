name: Continuous Deployment

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: GH_SSH
    steps:
      - name: cd
        uses: appleboy/ssh-action@v1.0.3
        env:
          FRONTEND_ENV_CONTENT: ${{ secrets.FRONTEND_ENV }}
          BACKEND_ENV_CONTENT: ${{ secrets.BACKEND_ENV }}
          MONO_ENV_CONTENT: ${{ secrets.MONO_ENV }}
          GH_SSH: ${{ secrets.GH_SSH }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: FRONTEND_ENV_CONTENT,BACKEND_ENV_CONTENT,MONO_ENV_CONTENT,GH_SSH
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd /home/deploy/showcase-mono
            git fetch origin
            git checkout main
            git pull origin main
            
            echo "$FRONTEND_ENV_CONTENT" > ./packages/frontend/.env
            echo "$BACKEND_ENV_CONTENT" > ./packages/backend/.env
            echo "$MONO_ENV_CONTENT" > .env
            
            docker compose up --build -d
