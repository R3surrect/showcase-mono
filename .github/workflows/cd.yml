name: Continuous Deployment

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ENV
    steps:
      - name: cd
        uses: appleboy/ssh-action@v1.0.3
        env:
          ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS }}
          NODE_ENV: ${{ vars.NODE_ENV }}
          PORT: ${{ vars.PORT }}
          VITE_BACKEND_API_PORT: ${{ vars.VITE_BACKEND_API_PORT }}
          VITE_BACKEND_API_URL: ${{ vars.VITE_BACKEND_API_URL }}
          VITE_FRONTEND_PORT: ${{ vars.VITE_FRONTEND_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_USER: ${{ secrets.DB_USER }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: ALLOWED_ORIGINS,NODE_ENV,PORT,VITE_BACKEND_API_PORT,VITE_BACKEND_API_URL,VITE_FRONTEND_PORT,DB_NAME,DB_PASSWORD,DB_USER,JWT_SECRET
          script: |
            set -e
            cd /home/deploy/showcase-mono
            git fetch origin
            git checkout main
            git pull origin main

            # packages/frontend/.env
            echo "VITE_BACKEND_API_PORT='$VITE_BACKEND_API_PORT'" > ./packages/frontend/.env
            echo "VITE_BACKEND_API_URL='$VITE_BACKEND_API_URL'" >> ./packages/frontend/.env
            echo "VITE_FRONTEND_PORT='$VITE_FRONTEND_PORT'" >> ./packages/frontend/.env

            # packages/backend/.env
            echo "DB_NAME='$DB_NAME'" > ./packages/backend/.env
            echo "DB_PASSWORD='$DB_PASSWORD'" >> ./packages/backend/.env
            echo "DB_USER='$DB_USER'" >> ./packages/backend/.env
            echo "JWT_SECRET='$JWT_SECRET'" >> ./packages/backend/.env
            echo "ALLOWED_ORIGINS='$ALLOWED_ORIGINS'" >> ./packages/backend/.env
            echo "NODE_ENV='$NODE_ENV'" >> ./packages/backend/.env
            echo "PORT='$PORT'" >> ./packages/backend/.env

            # root .env
            echo "NODE_ENV='$NODE_ENV'" > .env
            echo "PORT='$PORT'" >> .env

            docker compose up --build -d