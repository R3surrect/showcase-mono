services:
  frontend:
    image: showcase-frontend-image
    build:
      context: ../..
      dockerfile: ./packages/frontend/Dockerfile
      args:
        - VITE_FRONTEND_PORT=${VITE_FRONTEND_PORT}
    container_name: showcase_frontend
    env_file:
      - path: .env.production
        required: true
    command: caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    restart: always
    ports:
      - "80:80"
      - "8443:8443"
    depends_on:
      - backend
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config: