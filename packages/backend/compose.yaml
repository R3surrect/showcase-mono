services:
  backend:
    environment:
      - NODE_ENV=production
      - NODE_OPTIONS=--conditions=production
    build:
      context: ../..
      dockerfile: ./packages/backend/Dockerfile
      args:
        - ENV_PORT=${PORT}
        - DATABASE_URL=postgres://${PGUSER}:${PGPASSWORD}@postgres:5432/${PGDATABASE}
        - NODE_ENV=production
    container_name: showcase_backend
    restart: always
    env_file:
      - .env.production
      - ../../.env.production
    ports:
      - "8080:${PORT}"
    depends_on:
      - postgres
