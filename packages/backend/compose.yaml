services:
  backend:
    build:
      context: .
      dockerfile: ./packages/backend/Dockerfile
      args:
        - ENV_PORT=${PORT}
        - DATABASE_URL=postgres://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
        - NODE_ENV=production
    container_name: showcase_backend
    restart: always
    env_file:
      - .env
      - ./packages/backend/.env
    ports:
      - "8080:${PORT}"
    depends_on:
      - postgres
