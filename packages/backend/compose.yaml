services:
  backend:
    environment:
      - NODE_ENV=production
      - NODE_OPTIONS=--conditions=production
    build:
      context: ../..
      dockerfile: ./packages/backend/Dockerfile
      args:
        - PORT=${PORT}
        - DATABASE_URL=postgres://${PGUSER}:${PGPASSWORD}@postgres:5432/${PGDATABASE}
        - NODE_ENV=production
        - PGUSER=${PGUSER}
        - PGPASSWORD=${PGPASSWORD}
        - PGHOST=${PGHOST}
        - PGPORT=${PGPORT}
        - PGDATABASE=${PGDATABASE}
    container_name: showcase_backend
    restart: always
    env_file:
      - path: ./.env.production
        required: true
      - path: ../database/.env.production
        required: true
    depends_on:
      - postgres
